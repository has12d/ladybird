name: Ladybird Windows Native

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM + build tools
        run: |
          choco install -y sccache pkgconfiglite nasm --no-progress
          if (!(Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install -y llvm --no-progress --version=20.1.8
            echo "C:/Program Files/LLVM/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          clang-cl --version
          cmake --version
          ninja --version

      - name: Install wasm-tools
        run: |
          $VERSION="1.243.0"
          $NAME="wasm-tools-$VERSION-x86_64-windows"
          curl -L -o "$NAME.zip" "https://github.com/bytecodealliance/wasm-tools/releases/download/v$VERSION/$NAME.zip"
          Expand-Archive "$NAME.zip" -DestinationPath .
          Move-Item $NAME wasm-tools
          echo "$env:GITHUB_WORKSPACE/wasm-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (vcpkg + configure + compile)
        run: |
          python Meta\ladybird.py build --preset Release --jobs 4

      - name: Upload browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows-x64
          path: |
            Build/release/bin/
          retention-days: 7
          if-no-files-found: error
